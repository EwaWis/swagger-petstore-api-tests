name: Playwright Tests
run-name: PetStore API Playwright Tests

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
  
jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Run Tests
        run: |
             npm ci
             PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml npx playwright test --reporter=list,junit,html --output=results

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !failure() }}       # run this step even if previous step failed
        with:
          name: Playwright API Tests            # Name of the check run which will be created
          path: results.xml    # Path to test results
          reporter: java-junit 
          fail-on-error: true

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
                results.xml
                playwright-report